<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DELTA SCHOOL INTERNATIONAL</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#f4f8fb;--card:#fff;--tx:#0f2a3d;--mu:#5b7384;--pr:#0b7fab;--ac:#14b8a6;--bd:#d9e4ec;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1822;--card:#142431;--tx:#e6f0f6;--mu:#8fa6b5;--pr:#38b6e0;--ac:#2dd4bf;--bd:#233a4b;--er:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0c1822;--card:#142431;--tx:#e6f0f6;--mu:#8fa6b5;--pr:#38b6e0;--ac:#2dd4bf;--bd:#233a4b;--er:#ff7b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 14px 84px}
h1{font-size:20px;margin:6px 0}h2{font-size:17px;margin:14px 0 8px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:800;color:var(--pr)}.logo span{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.mu{color:var(--mu);font-size:13px}
input,select{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:13px}.nav button.on{color:var(--pr);border-top:2px solid var(--pr)}
.sim{background:#fff6dd;color:#6b4e00;border-radius:8px;padding:8px;font-size:13px}
.er{color:var(--er);font-size:13px}
.lg{color:#fff}body.lg{background:linear-gradient(160deg,#0a6e80 0%,#1d5fa8 55%,#5b3fc4 100%);background-attachment:fixed;min-height:100vh}
.rc{display:block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:24px;padding:22px 16px;text-align:center;margin:14px 0;cursor:pointer;color:#fff}
.rc input{background:rgba(255,255,255,.92);color:#0f2a3d}
.rc button{background:#f5b301;color:#1a1a1a}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kv{font-size:22px;font-weight:800;color:var(--pr)}.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac))}
body.in{background:#f3f5f7}body.in #app{max-width:none;padding:0}
.sb{position:fixed;left:0;top:0;bottom:0;width:62px;background:#0f1b33;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:30}
.sbn{width:46px;height:46px;border-radius:14px;background:transparent;padding:0;font-size:22px}.sbn.on{background:#14a38f}
.mn{--bg:#f3f5f7;--card:#fff;--tx:#0f1b33;--mu:#5b6b85;--bd:#e3e8f0;--pr:#0b7fab;--ac:#14a38f;margin-left:62px;padding:14px 14px 90px;min-height:100vh;background:#f3f5f7;color:#0f1b33}
.mn h2{font-size:24px}.mn .card{border-radius:20px;box-shadow:0 1px 4px rgba(15,27,51,.08)}
.kg{grid-template-columns:1fr}@media(min-width:560px){.kg{grid-template-columns:1fr 1fr}}
.kp{border-left:6px solid;border-radius:22px;padding:18px 20px;box-shadow:0 1px 4px rgba(15,27,51,.08)}.kv{font-size:36px;line-height:1.1;color:#0f1b33}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:#fff;color:#0f1b33;border-radius:28px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.md label{display:block;font-weight:700;color:#5b6b85;margin-top:10px}
.md input{background:#fff;color:#0f1b33;border:2px solid #e3e8f0;border-radius:16px;padding:14px;font-size:16px;margin:6px 0}
.md .ob{display:block;width:100%;background:#f97316;color:#fff;border-radius:18px;padding:14px;font-size:18px;margin-top:10px}
.md .x{background:transparent;color:#5b6b85;font-size:24px;padding:4px 8px}
.md .eye{position:absolute;right:8px;top:12px;background:transparent;padding:4px 8px;font-size:22px}
.md .lk{background:transparent;color:#0b7fab;padding:4px 0;font-size:14px;text-decoration:underline}
.md summary{font-weight:800;font-size:18px;margin:12px 0;cursor:pointer}.md details{border-top:2px solid #cfd6e0;margin-top:10px}.md p.mu{color:#5b6b85}
.ts{position:fixed;left:72px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#16a34a;color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;z-index:40}
.toolbtn{display:inline-flex;align-items:center;gap:6px;margin:4px 4px 4px 0}.supercontact{margin-left:auto;white-space:nowrap;background:#0b7fab;font-size:12px;padding:8px 10px}.flagselect{display:flex;gap:8px;align-items:center}.flagselect select{flex:1}.floathelp{position:fixed;right:14px;bottom:18px;z-index:45;box-shadow:0 5px 18px #0003;border-radius:99px}.tb{border-collapse:collapse;width:100%;font-size:13px}.tb th,.tb td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}
.sysp{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#0f2a3d;border:1px solid #d9e4ec;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}.sysd{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
</style>
</head>
